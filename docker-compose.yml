version: "3.8"

# Development-first baseline compose.
# For production on a single VM, use:
# docker compose -f docker-compose.yml -f compose.production.yaml up -d

services:
  # =============================================================================
  # Frontend - Next.js Dashboard
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - lazy-agents-network

  # =============================================================================
  # Backend - FastAPI Server
  # =============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - ./data:/app/data
    networks:
      - lazy-agents-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Redis - Job Queue (optional, SQLite used by default)
  # =============================================================================
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - lazy-agents-network
    command: redis-server --appendonly yes

  # =============================================================================
  # Worker - Background Job Processor
  # =============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    env_file:
      - .env
    depends_on:
      - api
      - redis
    volumes:
      - ./backend:/app
      - ./data:/app/data
    networks:
      - lazy-agents-network

networks:
  lazy-agents-network:
    driver: bridge

volumes:
  redis-data:

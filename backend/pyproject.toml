# =============================================================================
# LazyAgents Backend - Python Tool Configuration
# =============================================================================

[project]
name = "lazy-agents-backend"
version = "0.1.0"
requires-python = ">=3.11"

# =============================================================================
# Ruff - Linting & Formatting
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "S101",   # assert usage OK in tests
    "B008",   # function calls in default args (FastAPI Depends)
    "UP007",  # use X | Y for union types (keep Optional for readability)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"app/api/**/*.py" = ["B008"]
"app/core/config.py" = ["S104", "S105"]
"backend/app/core/config.py" = ["S104", "S105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# mypy - Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disable_error_code = [
    "arg-type",
    "assignment",
    "dict-item",
    "import-untyped",
    "index",
    "misc",
    "no-any-return",
    "override",
    "valid-type",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# =============================================================================
# pytest - Testing
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]

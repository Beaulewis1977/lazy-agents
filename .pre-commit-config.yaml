# Pre-commit hooks for LazyAgents
# Install: pre-commit install && pre-commit install --hook-type pre-push
# Run all: pre-commit run --all-files

default_stages: [pre-commit]

repos:
  # =========================================================================
  # General hooks
  # =========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # =========================================================================
  # Python: Ruff (lint + format)
  # =========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix, --config, backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
        files: ^backend/

  # =========================================================================
  # Python: mypy type checking
  # =========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--config-file, backend/pyproject.toml, --ignore-missing-imports]
        files: ^backend/app/
        additional_dependencies:
          - pydantic>=2.5.0
          - pydantic-settings>=2.1.0
          - fastapi>=0.109.0
          - sqlalchemy>=2.0.0
          - types-requests

  # =========================================================================
  # Frontend: ESLint + TypeScript check (via npm)
  # =========================================================================
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend-lint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend-typecheck
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [pre-push]

  # =========================================================================
  # Python: Tests (pre-push only)
  # =========================================================================
  - repo: local
    hooks:
      - id: backend-test
        name: backend-test
        entry: bash -c 'cd backend && ([ -x ./venv/bin/python ] && ./venv/bin/python -m pytest -x --tb=short -q || python -m pytest -x --tb=short -q)'
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]
